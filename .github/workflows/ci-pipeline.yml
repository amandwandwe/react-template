name: Continuous Integration Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version}}
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Clean Install Dependencies
        run: npm ci

      - name: Run Linting
        run: npm run lint

  build:
    runs-on: ubuntu-latest

    needs: test

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version}}
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Clean Install Dependencies
        run: npm ci

      - name: Run Build
        run: npm run build

  build-docker-image:
    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        id: build
        run: docker build -t ghcr.io/${{ github.actor }}/template:latest .

      - name: Push Docker Image
        id: push
        run: docker push ghcr.io/${{ github.actor }}/template:latest
