name: Continuous Deployment Pipeline

on:
  workflow_run:
    workflows: ["Continuous Integration Pipeline"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      environment:
        description: Target deployment environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: Docker image tag to deploy
        required: false
        default: latest
        type: string
      image_name:
        description: Docker image name without registry
        required: false
        default: template
        type: string
  workflow_call:
    inputs:
      environment:
        description: Target deployment environment
        required: true
        type: string
        default: production
      image_tag:
        description: Docker image tag to deploy
        required: false
        type: string
        default: latest
      image_name:
        description: Docker image name without registry
        required: false
        type: string
        default: template

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || github.event.inputs.environment || 'staging' }}
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ inputs.image_name || github.event.inputs.image_name || 'template' }}
      IMAGE_TAG: ${{ inputs.image_tag || github.event.inputs.image_tag || 'latest' }}
      DEPLOY_ENV: ${{ inputs.environment || github.event.inputs.environment || 'staging' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Docker image
        id: image
        shell: bash
        run: |
          IMAGE="${REGISTRY}/${{ github.repository_owner }}/${IMAGE_NAME}:${IMAGE_TAG}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Deploying Docker image: $IMAGE"
          echo "Environment: $DEPLOY_ENV"

      - name: Pull Docker Image for Deployment
        id: pull
        shell: bash
        run: docker pull "${{ steps.image.outputs.image }}"

      - name: Deploy Container
        id: deploy
        shell: bash
        run: |
          echo "Replace this step with your real deployment target."
          echo "Examples:"
          echo "  - docker run -d --rm -p 80:80 --name app ${{ steps.image.outputs.image }}"
          echo "  - ssh server 'docker pull ${{ steps.image.outputs.image }} && docker compose up -d'"
          echo "  - kubectl set image deployment/react-template app=${{ steps.image.outputs.image }}"
          echo "Target environment: $DEPLOY_ENV"
